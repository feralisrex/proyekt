<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Mens Basketball Shoes</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
    }

    .header {
      padding: 20px 40px;
      background: white;
      display: flex;
    }

    .main {
      width: 80%;
      margin-left: auto;
      padding: 20px 0;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .filters {
      display: flex;
      gap: 10px;
    }

    .filter {
      padding: 6px 12px;
      border: 1px solid #ccc;
      font-size: 12px;
    }

    .sort select {
      padding: 6px 10px;
      border: 1px solid #ccc;
    }

    .container {
      display: flex;
      flex-wrap: wrap;
      gap: 30px;
      margin-top: 25px;
    }

    .card {
      width: 300px;
      background: white;
      padding: 15px;
      box-sizing: border-box;
    }

    .card img {
      width: 100%;
      height: 180px;
      object-fit: contain;
      background: #f0f0f0;
    }

    .title {
      font-weight: 600;
      margin-top: 10px;
    }

    .type {
      font-size: 13px;
    }

    .price {
      margin-top: 5px;
      font-weight: bold;
    }

    a {
      text-decoration: none;
    }
  </style>

</head>
