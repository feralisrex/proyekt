<!DOCTYPE html>
<html lang="az">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navbar Example</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        .navbar {
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .menu {
            list-style-type: none;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #333;
        }

        .menu li {
            float: left;
        }

        .menu li a {
            display: block;
            color: white;
            text-align: center;
            padding: 14px 20px;
            text-decoration: none;
        }

        .menu li a:hover {
            background-color: #111;
        }

        .menu li a.active {
            background-color: #04AA6D;
        }

        .wrapper {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #0d1117;
            font-family: Arial;
        }

        .form-box {
            width: 350px;
            background: #111827;
            padding: 30px;
            border-radius: 10px;
            color: white;
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin: 10px 0 5px;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 6px;
            background: #1f2937;
            color: white;
            margin-bottom: 10px;
        }

        input::placeholder {
            color: #9ca3af;
        }

        .check {
            display: flex;
            align-items: center;
            font-size: 13px;
            margin: 10px 0;
        }

        .check a {
            color: #3b82f6;
            text-decoration: none;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #2563eb;
            border: none;
            border-radius: 6px;
            color: white;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
        }

        button:hover {
            background: #1d4ed8;
        }
    </style>
</head>

<body>

    <div class="navbar">
        <ul class="menu">
            <li><a class="active" href="./ev.html">ev</a></li>
            <li><a href="./xeberler.html">xeberler</a></li>
            <li><a href="./elaqe.html">elaqe</a></li>
        </ul>
    </div>

    <div class="wrapper">
        <div class="form-box">

            <h2>Sign Up</h2>

            <label>Full Name</label>
            <input type="text" placeholder="Enter Your Name">

            <label>Email Address</label>
            <input type="email" placeholder="Enter Your Email">

            <label>Password</label>
            <input type="password" placeholder="Enter Password">

            <div class="check">
                <span>I agree to the <a href="#">Terms</a> and <a href="#">Privacy Policy</a>.</span>
            </div>

            <button>Sign Up</button>

        </div>
    </div>

</body>

</html>
