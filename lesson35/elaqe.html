<!DOCTYPE html>
<html lang="az">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navbar Example</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        .navbar {
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .menu {
            list-style-type: none;
            overflow: hidden;
            background-color: #333;
        }

        .menu li {
            float: left;
        }

        .menu li a {
            display: block;
            color: white;
            text-align: center;
            padding: 14px 20px;
            text-decoration: none;
        }

        .menu li a:hover {
            background-color: #111;
        }

        .menu li a.active {
            background-color: #04AA6D;
        }
    </style>
</head>

<body>

    <div class="navbar">
        <ul class="menu">
            <li><a class="active" href="./ev.html">ev</a></li>
            <li><a href="./xeberler.html">xeberler</a></li>
            <li><a href="./elaqe.html">elaqe</a></li>
        </ul>
    </div>

</body>

</html>
