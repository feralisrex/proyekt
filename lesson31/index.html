<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Table Layout</title>

    <style>
        .body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: #eee;
            font-family: Arial;
        }

        table {
            width: 90%;
            height: 90vh;
            background: aqua;
            border-collapse: collapse;
        }

        td {
            border: 2px solid black;
            text-align: center;
        }

        .banner {
            height: 10%;
        }

        .nav {
            height: 8%;
        }

        .footer {
            height: 10%;
        }

        .content {
            width: 70%;
        }

        .sidebar {
            width: 30%;
        }

        .inner-table {
            width: 100%;
            height: 100%;
            border-collapse: collapse;
        }

        .inner-table td {
            border: 2px solid black;
        }
    </style>
</head>

<body>
    <div class="body">


        <table>
            <tr>
                <td colspan="2" class="banner">BANNER</td>
            </tr>

            <tr>
                <td colspan="2" class="nav">NAVIGATION LINKS</td>
            </tr>

            <tr>
                <td class="content">MAIN CONTENT</td>

                <td class="sidebar">
                    <table class="inner-table">
                        <tr>
                            <td>PICTURE</td>
                            <td>ABOUT ME BLURB</td>
                        </tr>
                        <tr>
                            <td colspan="2">RECENT TWEETS</td>
                        </tr>
                    </table>
                </td>
            </tr>

            <tr>
                <td colspan="2" class="footer">FOOTER</td>
            </tr>
        </table>
    </div>
</body>

</html>
