<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sign Up Form</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        .wrapper {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #0d1117;
            font-family: Arial;
        }

        .form-box {
            width: 350px;
            background: #111827;
            padding: 30px;
            border-radius: 10px;
            color: white;
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin: 10px 0 5px;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 6px;
            background: #1f2937;
            color: white;
            margin-bottom: 10px;
        }

        input::placeholder {
            color: #9ca3af;
        }

        .check {
            display: flex;
            align-items: center;
            font-size: 13px;
            margin: 10px 0;
        }

        .check i {
            color: #3b82f6;
            margin-right: 8px;
        }

        .check a {
            color: #3b82f6;
            text-decoration: none;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #2563eb;
            border: none;
            border-radius: 6px;
            color: white;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
        }

        button:hover {
            background: #1d4ed8;
        }
    </style>
</head>

<body>

<div class="wrapper">

    <div class="form-box">

        <h2>Sign Up</h2>

        <label>Full Name</label>
        <input type="text" placeholder="Enter Your Name">

        <label>Email Address</label>
        <input type="email" placeholder="Enter Your Email">

        <label>Password</label>
        <input type="password" placeholder="Enter Password">

        <div class="check">
            <i class="fa-solid fa-circle-check"></i>
            <span>I agree to the <a href="#">Terms</a> and <a href="#">Privacy Policy</a>.</span>
        </div>

        <button>Sign Up</button>

    </div>

</div>

</body>
</html>
