<!DOCTYPE html>
<html lang="az">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task</title>

    <style>
        .navbar {
            display: flex;
            justify-content: space-between;
            background: black;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .logo {
            background: green;
            color: white;
            padding: 15px 25px;
            font-weight: bold;
            font-size: 22px;
        }

        .nav-links {
            display: flex;
            list-style: none;
            margin-right: 20px;
        }

        .nav-links li {
            margin: 0 15px;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
            transition: 0.3s;
            display: inline-block;
        }

        .nav-links a:hover {
            color: green;
            transform: scale(1.2);
        }

        .body-container {
            background: #e6e6e6;
            padding: 30px;
            margin: 0;
        }

        .container {
            max-width: 1100px;
            margin: auto;
            display: flex;
            gap: 30px;
        }

        .left {
            background: #f5f5f5;
            padding: 20px;
            flex: 2;
        }

        .left h2 {
            color: #1b5e20;
            border-bottom: 2px solid gray;
            padding-bottom: 10px;
        }

        table {
            width: 100%;
            margin-top: 20px;
        }

        td {
            padding: 10px 0;
        }

        input,
        textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #aaa;
            border-radius: 5px;
        }

        textarea {
            height: 150px;
            resize: vertical;
        }

        button {
            margin-top: 15px;
            background: green;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
        }

        .right {
            background: #f5f5f5;
            padding: 20px;
            flex: 1;
        }

        .right h2 {
            color: #1b5e20;
            border-bottom: 2px solid gray;
            padding-bottom: 10px;
        }

        .icons {
            display: flex;
            gap: 20px;
            margin-top: 20px;
        }

        .icons img {
            width: 80px;
            transition: 0.3s;
            cursor: pointer;
        }

        .icons img:hover {
            transform: scale(1.3);
        }
    </style>
</head>

<body>

    <div class="navbar">
        <div class="logo">Elcan</div>
        <ul class="nav-links">
            <li><a href="./about.html">About</a></li>
            <li><a href="./portfolio.html">Portfolio</a></li>
            <li><a href="./contact.html">Contact</a></li>
        </ul>
    </div>

    <div class="body-container">
        <div class="container">

            <div class="left">
                <h2>Contact</h2>

                <table>
                    <tr>
                        <td>Name</td>
                    </tr>
                    <tr>
                        <td><input type="text" placeholder="Name"></td>
                    </tr>

                    <tr>
                        <td>E-mail</td>
                    </tr>
                    <tr>
                        <td><input type="email" placeholder="Email"></td>
                    </tr>

                    <tr>
                        <td>Message</td>
                    </tr>
                    <tr>
                        <td><textarea placeholder="Message..."></textarea></td>
                    </tr>

                    <tr>
                        <td><button>Submit</button></td>
                    </tr>
                </table>
            </div>

            <div class="right">
                <h2>Connect with Me</h2>

                <div class="icons">
                    <img src="https://cdn-icons-png.flaticon.com/512/25/25231.png">
                    <img src="https://cdn-icons-png.flaticon.com/512/2111/2111463.png">
                    <img src="https://cdn-icons-png.flaticon.com/512/174/174857.png">
                </div>
            </div>

        </div>
    </div>

</body>

</html>
