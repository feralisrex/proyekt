<!DOCTYPE html>
<html lang="az">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task</title>

    <style>


        .navbar {
            display: flex;
            justify-content: space-between;
            background: black;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .logo {
            background: green;
            color: white;
            padding: 15px 25px;
            font-weight: bold;
            font-size: 22px;
        }

        .nav-links {
            display: flex;
            list-style: none;
            margin-right: 20px;
        }

        .nav-links li {
            margin: 0 15px;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
            transition: 0.3s;
            display: inline-block;
        }

        .nav-links a:hover {
            color: green;
            transform: scale(1.2);
        }

        .body-container {
            background: #e6e6e6;
            padding: 30px;
            margin: 0;
        }

        .container {
            max-width: 1100px;
            margin: auto;
            display: flex;
            gap: 30px;
        }

        .left {
            background: #f5f5f5;
            padding: 20px;
        }

        .left h2 {
            color: #1b5e20;
            border-bottom: 2px solid gray;
            padding-bottom: 10px;
        }

        .about-content {
            display: flex;
            gap: 15px;
            margin-top: 15px;
        }

        .about-content img {
            width: 150px;
            height: 100px;
            object-fit: cover;
        }

        .right {
            background: #f5f5f5;
            padding: 20px;
        }

        .right h2 {
            color: #1b5e20;
            border-bottom: 2px solid gray;
            padding-bottom: 10px;
        }

        .icons {
            display: flex;
            gap: 20px;
            margin-top: 20px;
        }

        .icons img {
            width: 80px;
            transition: 0.3s;
            cursor: pointer;
        }

        .icons img:hover {
            transform: scale(1.3);
        }
    </style>
</head>

<body>

    <div class="navbar">
        <div class="logo">Elcan</div>
        <ul class="nav-links">
            <li><a href="./about.html">About</a></li>
            <li><a href="./portfolio.html">Portfolio</a></li>
            <li><a href="./contact.html">Contact</a></li>
        </ul>
    </div>

    <div class="body-container">
        <div class="container">

            <div class="left">
                <h2>About Me</h2>

                <div class="about-content">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/d/d1/Mount_Everest_as_seen_from_Drukair2_PLW_edit.jpg?utm_source=az.wikiquote.org&utm_campaign=index&utm_content=original"
                        alt="">
                    <p>
                        Lorem ipsum dolor sit amet consectetur adipisicing elit.
                        Ratione magnam consectetur nisi velit neque dolor recusandae
                        nostrum ad alias animi distinctio ipsum enim rem laborum.
                    </p>
                </div>
            </div>

            <div class="right">
                <h2>Connect with Me</h2>

                <div class="icons">
                    <img src="https://cdn-icons-png.flaticon.com/512/25/25231.png">
                    <img src="https://cdn-icons-png.flaticon.com/512/2111/2111463.png">
                    <img src="https://cdn-icons-png.flaticon.com/512/174/174857.png">
                </div>
            </div>

        </div>
    </div>

</body>

</html>
