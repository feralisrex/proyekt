<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>CSS tələbləri - Tələbə cədvəli</title>
    <style>
        h1 {
            text-align: center;
            font-family: sans-serif;
        }

        table {
            width: 80%;
            margin: auto;
            border-collapse: collapse;
            font-family: sans-serif;
            box-shadow: 0 0 8px rgba(0, 0, 0, 0.05);
        }


        td {
            padding: 10px;
            text-align: left;
        }


        tbody tr:nth-child(even) {
            background-color: blue;
        }

        tbody tr:nth-child(odd) {
            background-color: red;
        }


        table {
            border-collapse: collapse;
            width: 100%;
        }

        th,
        td {
            text-align: left;
            padding: 8px;
            border-bottom: 3px solid #000000;
        }
    </style>
</head>
