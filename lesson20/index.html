<!DOCTYPE html>
<html lang="az">

<head>

    <title>CV</title>

    <style>

            border: 6px solid #555;
            background: #eee;
            padding: 10px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        td {
            border: 2px solid #555;
            padding: 8px;
        }

        .center {
            text-align: center;
        }
    </style>

</head>
