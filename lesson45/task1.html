<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Card</title>
    <link rel="stylesheet" href="task1.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>
    <div class="body">
        <div class="card">
            <div class="card-top" id="bg"></div>

            <div class="profile-img">
                <img src="https://cdn-icons-png.flaticon.com/512/147/147144.png" alt="">
            </div>

            <div class="menu">
                <i class="fa-solid fa-ellipsis-vertical"></i>
            </div>

            <h2 id="fullname"></h2>
            <p id="field"></p>

            <div class="stats">
                <div>
                    <h3 id="followers"></h3>
                    <span>Followers</span>
                </div>
                <div>
                    <h3 id="following"></h3>
                    <span>Following</span>
                </div>
            </div>

            <button>Follow</button>

            <p class="about" id="about"></p>
        </div>

    </div>

    <script src="task1.js"></script>
</body>

</html>
