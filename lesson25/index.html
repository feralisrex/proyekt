<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Academic Programs</title>

    <style>
        .container {
            width: 100%;
            margin: 40px auto;
            display: flex;
            flex-wrap: wrap;
            gap: 30px;
            /* justify-content: center; */
        }

        .box {
            width: 100%;
            display: flex;
            flex-wrap: wrap;
            gap: 25px;
            justify-content: space-around;
        }

        .card {
            width: 360px;
            background: white;
        }

        .card img {
            width: 100%;
            height: 200px;
            display: block;
        }

        .card h3 {
            margin: 15px 0 0 0;
            font-size: 1.1rem;
            color: #333;
        }

        h1 {
            /* text-align: center; */
            margin: 40px 0 20px;
            color: #222;
            font-size: 2.2rem;
        }
    </style>
</head>

<body>

    <h1>Academic Programs</h1>

    <div class="container">

        <div class="box">
            <div class="card">
                <img src="https://upload.wikimedia.org/wikipedia/commons/e/e7/Everest_North_Face_toward_Base_Camp_Tibet_Luca_Galuzzi_2006.jpg"
                    alt="Architecture">
                <h3>Architecture</h3>
            </div>

            <div class="card">
                <img src="https://upload.wikimedia.org/wikipedia/commons/e/e7/Everest_North_Face_toward_Base_Camp_Tibet_Luca_Galuzzi_2006.jpg"
                    alt="Arts & Humanities">
                <h3>Arts & Humanities</h3>
            </div>

            <div class="card">
                <img src="https://upload.wikimedia.org/wikipedia/commons/e/e7/Everest_North_Face_toward_Base_Camp_Tibet_Luca_Galuzzi_2006.jpg"
                    alt="Business">
                <h3>Business</h3>
            </div>
        </div>

        <div class="box">
            <div class="card">
                <img src="https://upload.wikimedia.org/wikipedia/commons/e/e7/Everest_North_Face_toward_Base_Camp_Tibet_Luca_Galuzzi_2006.jpg"
                    alt="Communication & Information">
                <h3>Communication & Information</h3>
            </div>

            <div class="card">
                <img src="https://upload.wikimedia.org/wikipedia/commons/e/e7/Everest_North_Face_toward_Base_Camp_Tibet_Luca_Galuzzi_2006.jpg"
                    alt="Continuing & Professional Education">
                <h3>Continuing & Professional Education</h3>
            </div>

            <div class="card">
                <img src="https://upload.wikimedia.org/wikipedia/commons/e/e7/Everest_North_Face_toward_Base_Camp_Tibet_Luca_Galuzzi_2006.jpg"
                    alt="Education">
                <h3>Education</h3>
            </div>
        </div>

    </div>

</body>

</html>
