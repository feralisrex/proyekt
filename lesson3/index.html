<!DOCTYPE html>
<html>
<head>

    <title>Tapşiriq</title>
</head>
<body>
    <p><strong><em><u>Bu yazi həm qalin həm italic həmdə altdan xətt olacaq</u></em></strong></p>
    <hr>
    <p><del>Bu yazi silinmiş kimi görünəcək</del></p>
    <hr>
    <p><ins>Bu yazi altdan xətt olaraq görünəcək həmçinin mənaca daxil edilmiş olacaq</ins></p>
    <hr>
    <p>X<sup>5</sup></p>
    <hr>
    <p>Y<sub>7</sub></p>
</body>
</html>
