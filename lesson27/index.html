<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Cards</title>
    <style>
        .container {
            width: 100%;
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }

        .card {
            width: 440px;
            height: 220px;
            border-radius: 15px;
            padding: 20px;
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .purple {
            background: purple;
        }

        .black {
            background: black;
        }

        .green {
            background: green;
        }

        .blue {
            background: blue;
        }

        .top {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .number {
            letter-spacing: 3px;
            font-size: 18px;
        }

        .bottom {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
        }

        .name {
            font-weight: bold;
        }

        .valid {
            font-size: 12px;
        }

        .logo {
            width: 70px;
        }

        .chip {
            width: 50px;
        }

        .bank {
            height: 30px;
        }
    </style>
</head>

<body>
    <div class="body">

        <div class="container">

            <div class="card purple">
                <div class="top">
                    <img class="chip"
                        src="https://static.vecteezy.com/system/resources/thumbnails/009/400/645/small/sim-card-clipart-design-illustration-free-png.png">
                </div>

                <div class="number">4500 6812 5512 6089</div>

                <div class="bottom">
                    <div>
                        <div class="name">ALEKSEEV IVAN</div>
                        <div class="valid">07/22</div>
                    </div>
                    <img class="logo"
                        src="https://toppng.com/uploads/preview/visa-logo-transparent-11661940011pv28xfhnmf.png">
                </div>
            </div>

            <div class="card black">
                <div class="top">
                    <img class="chip"
                        src="https://static.vecteezy.com/system/resources/thumbnails/009/400/645/small/sim-card-clipart-design-illustration-free-png.png">
                    <img class="bank"
                        src="https://p7.hiclipart.com/preview/202/866/511/tinkoff-bank-russia-tcs-group-holding-nasdaq-general-insurance.jpg">
                </div>

                <div class="number">4500 6812 5512 6089</div>

                <div class="bottom">
                    <div>
                        <div class="name">ALEKSEEV IVAN</div>
                        <div class="valid">07/22</div>
                    </div>
                    <img class="logo" src="https://toppng.com/uploads/preview/visa-logo-transparent-11661940011pv28xfhnmf.png">
                </div>
            </div>

            <div class="card green">
                <div class="top">
                    <img class="chip"
                        src="https://static.vecteezy.com/system/resources/thumbnails/009/400/645/small/sim-card-clipart-design-illustration-free-png.png">
                    <img class="bank"
                        src="https://upload.wikimedia.org/wikipedia/commons/thumb/2/27/Logo_Sberbank.svg/960px-Logo_Sberbank.svg.png">
                </div>

                <div class="number">4500 6812 5512 6089</div>

                <div class="bottom">
                    <div>
                        <div class="name">ALEKSEEV IVAN</div>
                        <div class="valid">07/22</div>
                    </div>
                    <img class="logo" src="https://upload.wikimedia.org/wikipedia/commons/2/2a/Mastercard-logo.svg">
                </div>
            </div>


            <div class="card blue">
                <div class="top">
                    <img class="chip"
                        src="https://static.vecteezy.com/system/resources/thumbnails/009/400/645/small/sim-card-clipart-design-illustration-free-png.png">
                    <img class="bank"
                        src="https://upload.wikimedia.org/wikipedia/ru/thumb/c/cc/VTB24_Logo.svg/3840px-VTB24_Logo.svg.png">
                </div>

                <div class="number">4500 6812 5512 6089</div>

                <div class="bottom">
                    <div>
                        <div class="name">ALEKSEEV IVAN</div>
                        <div class="valid">07/22</div>
                    </div>
                    <img class="logo" src="https://upload.wikimedia.org/wikipedia/commons/2/2a/Mastercard-logo.svg">
                </div>
            </div>

        </div>
    </div>
</body>

</html>
