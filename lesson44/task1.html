<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Work To-Dos</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        .body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #4aa3b5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            width: 500px;
            text-align: center;
            color: white;
        }

        h1 {
            letter-spacing: 2px;
        }

        .info {
            font-size: 14px;
            opacity: 0.9;
            margin-bottom: 5px;
        }

        .input-box {
            display: flex;
            margin: 20px 0;
        }

        input {
            flex: 1;
            padding: 10px;
            border: none;
            outline: none;
            font-size: 14px;
        }

        .btn {
            background: #2c6e78;
            border: none;
            padding: 0 15px;
            cursor: pointer;
            color: white;
            font-size: 16px;
        }

        ul {
            list-style: none;
            padding: 0;
        }

        li {
            background: #6bb3c2;
            margin: 10px 0;
            padding: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-radius: 3px;
            cursor: pointer;
        }

        input[type="checkbox"] {
            display: none;
        }

        label {
            flex: 1;
            text-align: left;
            cursor: pointer;
        }

        input[type="checkbox"]:checked+label {
            text-decoration: line-through;
            opacity: 0.6;
        }

        .delete {
            margin-left: 10px;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <div class="body">

        <div class="container">
            <h1>WORK TO-DOS</h1>

            <div class="info">Enter text into the input field to add items to your list (max. 28 characters).</div>
            <div class="info" style="color:#9ff;">Click the item to mark it as complete.</div>
            <div class="info">Click the "X" to remove the item from your list.</div>

            <div class="input-box">
                <input type="text" placeholder="New item...">
                <button class="btn"><i class="fa-solid fa-pen"></i></button>
            </div>

            <ul>
                <li>
                    <input type="checkbox" id="t1">
                    <label for="t1">Don't Panic</label>
                    <i class="fa-solid fa-xmark delete"></i>
                </li>

                <li>
                    <input type="checkbox" id="t2">
                    <label for="t2">Edit Meeting</label>
                    <i class="fa-solid fa-xmark delete"></i>
                </li>

                <li>
                    <input type="checkbox" id="t3">
                    <label for="t3">Go Over %Ages</label>
                    <i class="fa-solid fa-xmark delete"></i>
                </li>
            </ul>
        </div>
    </div>


</body>

</html>
