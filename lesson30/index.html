<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .body {
            width: 100%;
            height: 100vh;
            background-color: black;
            font-family: Arial;
        }

        div {
            width: 24%;
            height: 100vh;
            background-color: red;
            display: flex;
            justify-content: space-around;
        }

        @media screen and (min-width: 768px) and (max-width: 991px) {
            .body {
                background-color: green;
            }

            div {
                width: 48%;
                height: 48vh;
                background-color: blue;
                display: flex;
                flex-wrap: wrap;
                justify-content: space-around;
            }
        }

        @media screen and (max-width: 767px) {
            .body {
                background-color: red;
            }

            div {
                width: 100%;
                height: 23vh;
                background-color: green;
                display: flex;
                flex-direction: column;
            }
        }
    </style>
</head>

<body>
    <div class="body">

        <div>
            <h1>mehdi</h1>
        </div>
        <div>
            <h1>mehdi</h1>
        </div>
        <div>
            <h1>mehdi</h1>
        </div>
        <div>
            <h1>mehdi</h1>
        </div>
    </div>
</body>

</html>
